version: '3.9'

services:
  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata inventory/fixtures/initial_data.json &&
             python manage.py seed_users &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
